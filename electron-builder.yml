# Identité depuis la 1.9.0 (avant : com.wolfgangproxa.modpackdownloader, « Modpack Downloader.exe », dossier
# Programs\minecraft-modpack-downloader) : le nouvel installeur désinstalle l'ancienne application (build/installer.nsh).
appId: com.wolfgangproxa.modpackmanager
productName: Modpack Manager
executableName: Modpack Manager
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack: []
# mpm.cmd : les commandes du moteur dans le terminal, à côté de l'exécutable.
extraFiles:
  - from: build/mpm.cmd
    to: mpm.cmd
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Modpack-Manager-Setup-${version}.${ext}
nsis:
  # Installeur « assisté » pour pouvoir dessiner ses fenêtres aux couleurs de l'application (build/installer.nsh),
  # réglé pour se comporter comme un installeur « en un clic » : aucune question, pour l'utilisateur seul.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  # Le raccourci du bureau est proposé par l'application elle-même (bureau ou autre emplacement).
  createDesktopShortcut: false
  include: build/installer.nsh
  createStartMenuShortcut: true
  shortcutName: Modpack Manager
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish: null
