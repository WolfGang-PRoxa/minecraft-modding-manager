# Vérifie chaque push et chaque pull request : formatage, ESLint, types, documentation (npm run check) et tests.
# Sous Linux : les tests propres à Windows (chiffrement DPAPI) y sont sautés. La version de Node vient de .node-version.
#
# Comme pour la publication, chaque action externe est figée sur un commit (la version en commentaire).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Formatage, ESLint, types et documentation
        run: npm run check

      - name: Tests
        run: npm test
