# Construit l'installeur Windows, le fait signer par SignPath (si c'est configuré) et le publie
# quand un tag app-vX.Y.Z est poussé.
#
# Chaque action externe est figée sur un commit (la version en commentaire) : une étiquette comme « v5 » peut être
# déplacée par son auteur, ou par quiconque prendrait son compte. Le droit d'écrire sur le dépôt n'est donné qu'au
# second job, qui publie, et qui n'exécute ni le code du dépôt ni ses dépendances.
name: Publier l'application

on:
  push:
    tags: ['app-v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    # La signature attend l'approbation manuelle de la demande sur signpath.io.
    timeout-minutes: 300
    permissions:
      contents: read
      # SignPath récupère l'installeur à signer parmi les artefacts du workflow.
      actions: read
    env:
      # La signature s'active dès que le secret SIGNPATH_API_TOKEN existe (README, « Signature du code »).
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.version.outputs.installer }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version de package.json ($PKG_VERSION)."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "installer=Modpack-Manager-Setup-$PKG_VERSION.exe" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Le texte de la release vient de CHANGELOG.md : sans entrée pour cette version, on s'arrête avant de construire.
      # L'application installée relit ce texte pour présenter la mise à jour.
      - name: Notes de version (CHANGELOG.md)
        shell: bash
        run: npx tsx scripts/changelog.ts --notes "${{ steps.version.outputs.version }}" --sortie release-notes.md

      # Vérifie aussi la documentation intégrée (npm run build lance docs:verifier).
      - run: npm run build:win

      - name: Préparer l'installeur à signer
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installeur-non-signe
          path: dist/${{ steps.version.outputs.installer }}
          if-no-files-found: error
          retention-days: 1

      - name: Signer avec SignPath (approuver la demande sur signpath.io)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist/signed

      - name: Remplacer par l'installeur signé et vérifier la signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $name = '${{ steps.version.outputs.installer }}'
          Copy-Item "dist/signed/$name" "dist/$name" -Force
          $signature = Get-AuthenticodeSignature "dist/$name"
          if ($signature.Status -ne 'Valid') { throw "Signature invalide : $($signature.StatusMessage)" }
          Write-Host "Signé par : $($signature.SignerCertificate.Subject)"

      - name: Transmettre l'installeur et les notes au job de publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/${{ steps.version.outputs.installer }}
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Modpack Manager ${{ needs.build.outputs.version }}
          files: release/dist/${{ needs.build.outputs.installer }}
          make_latest: true
          body_path: release/release-notes.md
