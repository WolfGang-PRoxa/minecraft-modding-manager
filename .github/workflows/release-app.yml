# Construit l'installeur Windows, le fait signer par SignPath (si c'est configuré) et le publie
# quand un tag app-vX.Y.Z est poussé.
name: Publier l'application

on:
  push:
    tags: ['app-v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    # La signature attend l'approbation manuelle de la demande sur signpath.io.
    timeout-minutes: 300
    env:
      # La signature s'active dès que le secret SIGNPATH_API_TOKEN existe (README, « Signature du code »).
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version de package.json ($PKG_VERSION)."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "installer=Modpack-Manager-Setup-$PKG_VERSION.exe" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Le texte de la release vient de CHANGELOG.md : sans entrée pour cette version, on s'arrête avant de construire.
      # L'application installée relit ce texte pour présenter la mise à jour.
      - name: Notes de version (CHANGELOG.md)
        shell: bash
        run: npx tsx scripts/changelog.ts --notes "${{ steps.version.outputs.version }}" --sortie release-notes.md

      # Vérifie aussi la documentation intégrée (npm run build lance docs:verifier).
      - run: npm run build:win

      - name: Préparer l'installeur à signer
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installeur-non-signe
          path: dist/${{ steps.version.outputs.installer }}
          if-no-files-found: error
          retention-days: 1

      - name: Signer avec SignPath (approuver la demande sur signpath.io)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist/signed

      - name: Remplacer par l'installeur signé et vérifier la signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $name = '${{ steps.version.outputs.installer }}'
          Copy-Item "dist/signed/$name" "dist/$name" -Force
          $signature = Get-AuthenticodeSignature "dist/$name"
          if ($signature.Status -ne 'Valid') { throw "Signature invalide : $($signature.StatusMessage)" }
          Write-Host "Signé par : $($signature.SignerCertificate.Subject)"

      - uses: softprops/action-gh-release@v2
        with:
          name: Modpack Manager ${{ steps.version.outputs.version }}
          files: dist/${{ steps.version.outputs.installer }}
          make_latest: true
          body_path: release-notes.md
